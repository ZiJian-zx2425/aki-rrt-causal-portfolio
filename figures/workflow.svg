   <g id="text_1">
    <text style="fill: #087f8c; font: 700 11px 'DejaVu Sans'; text-anchor: start" x="43.272" y="36.726281" transform="rotate(-0 43.272 36.726281)">RRT TIMING IN SEVERE AKI</text>
   </g>
   <g id="text_2">
    <text style="fill: #152d45; font: 700 25px 'DejaVu Sans'; text-anchor: start" x="43.272" y="72.060094" transform="rotate(-0 43.272 72.060094)">Target trial design &amp; causal machine learning</text>
   </g>
   <g id="text_3">
    <text style="fill: #23364a; font: 13px 'DejaVu Sans'; text-anchor: start" x="43.272" y="98.221969" transform="rotate(-0 43.272 98.221969)">A course-project methods portfolio with an independent synthetic implementation</text>
   </g>
   <g id="text_4">
    <text style="fill: #152d45; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="43.272" y="139.798125" transform="rotate(-0 43.272 139.798125)">01  CLINICAL DESIGN</text>
   </g>
   <g id="text_5">
    <text style="fill: #63748a; font: 11px 'DejaVu Sans'; text-anchor: start" x="329.04" y="139.038281" transform="rotate(-0 329.04 139.038281)">Documented intent; full clinical emulation remains unverified</text>
   </g>
   <g id="text_6">
    <text style="fill: #152d45; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="65.8512" y="180.777169" transform="rotate(-0 65.8512 180.777169)">Define the decision</text>
   </g>
   <g id="text_7">
    <text style="fill: #23364a; font: 10.5px 'DejaVu Sans'" transform="translate(65.8512 204.279159)">Incident stage 3 AKI in hospitalized adults</text>
    <text style="fill: #23364a; font: 10.5px 'DejaVu Sans'" transform="translate(65.8512 219.627124)">Eligibility and baseline covariates at time zero</text>
    <text style="fill: #23364a; font: 10.5px 'DejaVu Sans'" transform="translate(65.8512 234.975089)">Outcome: 30-day all-cause mortality</text>
   </g>
   <g id="text_8">
    <text style="fill: #152d45; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="432.7632" y="180.777169" transform="rotate(-0 432.7632 180.777169)">Specify the strategies</text>
   </g>
   <g id="text_9">
    <text style="fill: #23364a; font: 10.5px 'DejaVu Sans'" transform="translate(432.7632 204.279159)">Initiate within 24 h vs no initiation in 24 h</text>
    <text style="fill: #23364a; font: 10.5px 'DejaVu Sans'" transform="translate(432.7632 219.627124)">Comparator allows later or no RRT</text>
    <text style="fill: #23364a; font: 10.5px 'DejaVu Sans'" transform="translate(432.7632 234.975089)">72 h window = alternative protocol</text>
   </g>
   <g id="text_10">
    <text style="fill: #152d45; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="799.6752" y="180.777169" transform="rotate(-0 799.6752 180.777169)">Resolve timing &amp; ascertainment</text>
   </g>
   <g id="text_11">
    <text style="fill: #23364a; font: 10.5px 'DejaVu Sans'" transform="translate(799.6752 204.279159)">Align eligibility, assignment and follow-up</text>
    <text style="fill: #23364a; font: 10.5px 'DejaVu Sans'" transform="translate(799.6752 219.627124)">Validate grace-period and censoring rules</text>
    <text style="fill: #23364a; font: 10.5px 'DejaVu Sans'" transform="translate(799.6752 234.975089)">Confirm post-discharge outcome capture</text>
   </g>
   <g id="text_12">
    <text style="fill: #087f8c; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="43.272" y="302.086125" transform="rotate(-0 43.272 302.086125)">02  PUBLIC EXECUTABLE DEMO</text>
   </g>
   <g id="text_13">
    <text style="fill: #63748a; font: 11px 'DejaVu Sans'; text-anchor: start" x="413.712" y="301.326281" transform="rotate(-0 413.712 301.326281)">Baseline treatment at t = 0; no clinical treatment window</text>
   </g>
   <g id="text_14">
    <text style="fill: #087f8c; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="65.8512" y="343.065169" transform="rotate(-0 65.8512 343.065169)">Generate</text>
   </g>
   <g id="text_15">
    <text style="fill: #23364a; font: 10.5px 'DejaVu Sans'" transform="translate(65.8512 366.567159)">Independent mathematical distributions</text>
    <text style="fill: #23364a; font: 10.5px 'DejaVu Sans'" transform="translate(65.8512 381.915124)">Measured baseline confounding</text>
    <text style="fill: #23364a; font: 10.5px 'DejaVu Sans'" transform="translate(65.8512 397.263089)">Known potential-outcome risks</text>
    <text style="fill: #23364a; font: 10.5px 'DejaVu Sans'" transform="translate(65.8512 412.611054)">Fixed seed; no clinical data</text>
   </g>
   <g id="text_16">
    <text style="fill: #087f8c; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="341.0352" y="343.065169" transform="rotate(-0 341.0352 343.065169)">Estimate</text>
   </g>
   <g id="text_17">
    <text style="fill: #23364a; font: 10.5px 'DejaVu Sans'" transform="translate(341.0352 366.567159)">Cross-fitted propensity + outcome fits</text>
    <text style="fill: #23364a; font: 10.5px 'DejaVu Sans'" transform="translate(341.0352 381.915124)">IPW and explicit AIPW</text>
    <text style="fill: #23364a; font: 10.5px 'DejaVu Sans'" transform="translate(341.0352 397.263089)">Weighted Cox working model</text>
    <text style="fill: #23364a; font: 10.5px 'DejaVu Sans'" transform="translate(341.0352 412.611054)">Optional CausalForestDML</text>
   </g>
   <g id="text_18">
    <text style="fill: #087f8c; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="616.2192" y="343.065169" transform="rotate(-0 616.2192 343.065169)">Diagnose</text>
   </g>
   <g id="text_19">
    <text style="fill: #23364a; font: 10.5px 'DejaVu Sans'" transform="translate(616.2192 366.567159)">Overlap and covariate balance</text>
    <text style="fill: #23364a; font: 10.5px 'DejaVu Sans'" transform="translate(616.2192 381.915124)">Effective sample size + weight tails</text>
    <text style="fill: #23364a; font: 10.5px 'DejaVu Sans'" transform="translate(616.2192 397.263089)">Clipping / weight-cap sensitivity</text>
    <text style="fill: #23364a; font: 10.5px 'DejaVu Sans'" transform="translate(616.2192 412.611054)">Weighted survival point estimates</text>
   </g>
   <g id="text_20">
    <text style="fill: #087f8c; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="891.4032" y="343.065169" transform="rotate(-0 891.4032 343.065169)">Verify</text>
   </g>
   <g id="text_21">
    <text style="fill: #23364a; font: 10.5px 'DejaVu Sans'" transform="translate(891.4032 366.567159)">Compare with known synthetic truth</text>
    <text style="fill: #23364a; font: 10.5px 'DejaVu Sans'" transform="translate(891.4032 381.915124)">Test double robustness</text>
    <text style="fill: #23364a; font: 10.5px 'DejaVu Sans'" transform="translate(891.4032 397.263089)">Reject temporal boundary errors</text>
    <text style="fill: #23364a; font: 10.5px 'DejaVu Sans'" transform="translate(891.4032 412.611054)">Record seed and environment</text>
   </g>
   <g id="text_22">
    <text style="fill: #b56b22; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="43.272" y="492.598125" transform="rotate(-0 43.272 492.598125)">03  RESEARCH EXTENSION</text>
   </g>
   <g id="text_23">
    <text style="fill: #63748a; font: 11px 'DejaVu Sans'; text-anchor: start" x="343.152" y="491.838281" transform="rotate(-0 343.152 491.838281)">Proposed; not implemented in the public demo</text>
   </g>
   <g id="text_24">
    <text style="fill: #b56b22; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="65.8512" y="533.577169" transform="rotate(-0 65.8512 533.577169)">Grace-period-aware strategy comparison</text>
   </g>
   <g id="text_25">
    <text style="fill: #23364a; font: 10.5px 'DejaVu Sans'" transform="translate(65.8512 557.079159)">Specify within-window treatment and rescue rules; consider clone–censor–weight.</text>
    <text style="fill: #23364a; font: 10.5px 'DejaVu Sans'" transform="translate(65.8512 572.427124)">Model longitudinal history, artificial censoring, and observation censoring.</text>
   </g>
   <g id="text_26">
    <text style="fill: #b56b22; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="616.2192" y="533.577169" transform="rotate(-0 616.2192 533.577169)">Validate before stronger causal claims</text>
   </g>
   <g id="text_27">
    <text style="fill: #23364a; font: 10.5px 'DejaVu Sans'" transform="translate(616.2192 557.079159)">Audit timestamp resolution, indication bias, positivity, and outcome completeness.</text>
    <text style="fill: #23364a; font: 10.5px 'DejaVu Sans'" transform="translate(616.2192 572.427124)">Reproduce only inside an authorized research environment.</text>
   </g>
   <g id="text_28">
    <text style="fill: #7be0d6; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="59.5008" y="658.414125" transform="rotate(-0 59.5008 658.414125)">PUBLIC RELEASE</text>
   </g>
   <g id="text_29">
    <text style="fill: #ffffff; font: 12px 'DejaVu Sans'; text-anchor: start" x="230.256" y="658.466625" transform="rotate(-0 230.256 658.466625)">New code + methods + synthetic aggregates only  |  No patient data or clinical results</text>
   </g>
  </g>
 </g>
